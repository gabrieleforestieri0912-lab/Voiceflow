# Config Supabase minimale per VoiceFlow (solo Edge Function /transcribe).
# Il progetto Supabase dedicato va creato a parte e collegato con `supabase link`.
# Per il deploy: `supabase functions deploy transcribe`.

project_id = "voiceflow"

[functions.transcribe]
# Il client desktop invia l'anon key (Authorization: Bearer <anon>): la verifica JWT
# del gateway resta attiva. Serve comunque a poco contro abusi, quindi i veri limiti
# (rate limit + max size) sono dentro la funzione.
verify_jwt = true

[functions.transcribe.environment_variables]
# Placeholder: il valore reale va impostato come secret, non committato.
# supabase secrets set OPENAI_API_KEY=sk-...
